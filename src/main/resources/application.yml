spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: survey-constructor
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/survey_lab3}
    username: ${DB_USER:survey_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
